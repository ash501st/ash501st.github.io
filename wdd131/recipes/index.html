<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Ashton Canepari">
    <meta name="description" content="Recipes">

    <!-- Open Graph (Facebook, LinkedIn, etc.) -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="Recipe Book">
    <meta property="og:description" content="Simple recipes.">
    <meta property="og:url" content="Your URL">
    <meta property="og:image" content="social-preview-image.png">

    <!-- X Card -->
    <meta name="twitter:card" content="Social Preview Image">
    <meta name="twitter:title" content="Recipe Book">
    <meta name="twitter:description" content="Simple recipes.">
    <meta name="twitter:image" content="social-preview-image.png">                

    <!-- One favicon (ICO works everywhere) -->
    <link rel="icon" href="/favicon.ico">
    <!-- One Apple Touch Icon (iOS home screen) -->
    <link rel="apple-touch-icon" href="images/apple-touch-icon.png">

    <link rel="stylesheet" href="style.css">

    <title>Recipe Book</title>      
</head>
<body>

    <header>
        <div class="logo-container">
            <img src="recipe-book.png" alt="Recipe Book Logo" class="logo-icon">
            <h1 class="brand-name">RECIPEBOOK</h1>
        </div>
    </header>

    <main>
        <div class="search-container">
            <input type="text" placeholder="Find a recipe" aria-label="Search recipes">
            <button type="submit" class="search-button">
                <img src="search.svg" alt="Search">
            </button>
        </div>

        <article class="recipe-card">
            <div class="recipe-image-container">
                <img src="apple-crisp.jpg" alt="Apple Crips served with vanilla ice cream" class="recipe-image">
            </div>
            <div class="recipe-details">
                <span class="category-tag">dessert</span>
                <h2 class="recipe-title">APPLE CRISP</h2>

                <span class="rating" role="img" aria-label="Rating: 4 out of 5 stars">
                    <span aria-hidden="true" class="icon-star">⭐</span>
                    <span aria-hidden="true" class="icon-star">⭐</span>
                    <span aria-hidden="true" class="icon-star">⭐</span>
                    <span aria-hidden="true" class="icon-star">⭐</span>
                    <span aria-hidden="true" class="icon-star-empty">☆</span>
                </span>
                
                <p class="recipe-description">
                    This apple crips recipe is a simple yet delicious fall dessert that's great served warm with vanilla ice cream.
                </p>
            </div>
        </article>
    </main>

    <footer>
        <div class="attribution">
            <a href="https://www.flaticon.com/free-icons/recipe" title="recipe icons">Recipe icons created by Freepik - Flaticon</a>
        </div>                   
        <div class="social">
            <!-- Social media icons provided under CC from https://www.iconfinder.com/AlfredoCreates  -->
            <a href="#"><img src="instagram_icon.svg" alt="instagram icon"></a>
            <a href="#"><img src="youtube_icon.svg" alt="youtube icon"></a>
            <a href="#"><img src="pinterest_icon.svg" alt="pinterest icon"></a>
        </div>      
    </footer>            
    
</body>
</html>
